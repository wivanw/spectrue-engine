[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectrue-engine"
version = "1.2.0"
description = "Transparent, hallucination-resistant AI fact-checking engine."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [
    { name = "Ivan Bondarenko", email = "admin@spectrue.net" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "tavily-python>=0.3.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "trafilatura>=1.6.0",
    "tenacity>=8.2.0",
    "pydantic>=2.0.0",
    "colorlog>=6.7.0",
    "langdetect>=1.0.9",
    "pyyaml>=6.0",
    "diskcache>=5.6.0",
    "networkx>=3.0",  # M72: ClaimGraph PageRank
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["spectrue_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: proper unit tests (fast, no io)",
    "integration: end-to-end integration tests (slow, offline; external calls are mocked)"
]

[tool.ruff]
# Pin the rule set explicitly.
#
# There was no ruff config at all, so `ruff check .` ran with whatever defaults
# the installed version shipped — and the dev extra allows any `ruff>=0.1.0`.
# When CI picked up ruff 0.16, its expanded defaults turned 48 findings into
# 1566 (413x I001, ~357x UP*, 197x FURB157, 186x BLE001) and the lint gate
# started failing on style rules this project never opted into. An explicit
# select makes the gate deterministic across ruff upgrades.
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Re-export facades. These modules import names solely to expose them to
# callers, so F401 "unused import" and E402 "import not at top" are by design —
# 65 modules import from verdict/model.py, 13 from search_policy.py, and
# adapters/llm/claims.py plus the coverage tests import from extraction.py.
# Deleting the "unused" imports would break every one of those callers.
"spectrue_core/domain/claims/extraction.py" = ["F401", "E402"]
"spectrue_core/domain/verification/verdict/model.py" = ["F401", "E402"]
"spectrue_core/domain/verification/search/search_policy.py" = ["F401", "F811", "E402"]
"spectrue_core/use_cases/verification/scoring/rgba_audit/aggregation.py" = ["F401", "E402"]
