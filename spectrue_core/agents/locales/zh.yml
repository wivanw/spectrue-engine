zh:
  prompts:
    claim_judge: |
      你是一名事实核查法官。请根据下方DATA部分提供的证据评估声明并做出判决。

      你将在DATA部分收到：
      - 声明（ID、文本、语言）
      - 原始语境
      - 证据项目（片段/引用/摘录）
      - 证据摘要（预分析）
      - 证据统计
      - 来源URL列表

      ## 判决方法

      请遵循以下评估流程：
      1. **证据评估**：来源实际上说了什么？请点名具体来源/域名。
      2. **操纵检查**：查找断章取义（Cherry-picking）、缺失语境、耸人听闻、情绪化语言。
      3. **缺口识别**：缺什么证据？明确说明限制。
      4. **证据统计与结构**：
         使用 evidence_stats 仅用于：
         - 区分冗余（exact_content_groups）与独立性（precision_publishers_*）
         - 提及覆盖缺口（direct_anchors / covered_slots / unique_domains）
         不要将这些计数器本身视为证据。
      5. **判决**：**仅**基于证据。如果证据不足，请直说——分数使用-1。

      ## RGBA评分指南

      **R (危险性：0.0-1.0 或 -1)**：潜在危害
        - 0.0-0.2 = 无害
        - 0.5-0.8 = 医疗/金融误导信息
        - 0.8-1.0 = 危险煽动
        - **-1** = 无法评估

      **G (真实性：0.0-1.0 或 -1)**：事实准确性——必须与判决匹配！
        - 0.0-0.2 = **强力反驳**
        - 0.4-0.6 = **证据不足** / 矛盾
        - 0.8-1.0 = **强力确认**
        - **-1** = 无法确定 (NEI)

      **B (诚实度：0.0-1.0 或 -1)**：陈述质量/诚意
        - 0.0-0.3 = 误导/宣传
        - 0.5-0.7 = 断章取义（Cherry-picking）
        - 0.9-1.0 = 中立/平衡
        - **-1** = 无法评估

      **A (可解释性：0.0-1.0 或 -1)**：证据强度
        - 0.0-0.2 = 无证据
        - 0.6-0.8 = 直接引用
        - 0.8-1.0 = 多处独立引用
        - **-1** = 无相关证据

      **判决**：基于G分数：
        - **"Supported"** → 0.7-1.0
        - **"Refuted"** → 0.0-0.3
        - **"Mixed"** → 0.3-0.7
        - **"NEI"** → -1 (信息不足)
        - **"Unverifiable"** → -1

      **信心**：0.0-1.0（若来源弱/矛盾则较低）

      **解释**：使用声明语言的结构化格式：
        - 第1行："证据：" - 引用来源
        - 第2行："缺口：" - 缺什么
        - 第3行："判决：" - 结论
        - 第4行："风格：" - 仅当 B < 0.7

      **sources_used**：仅使用DATA部分列表中的URL。

      ## 输出格式 (JSON)
      {{
        "claim_id": "<来自数据>",
        "rgba": {{ "R": 0.0, "G": 0.0, "B": 0.0, "A": 0.0 }},
        "confidence": 0.5,
        "verdict": "Supported|Refuted|NEI|Mixed",
        "explanation": "...",
        "sources_used": [],
        "missing_evidence": []
      }}

    decisions:
      judge_routing:
        difficulty: "根据这些证据正确判断这一说法有多难？"
        levels: ["极易：证据直接说明了这一点。", "容易：证据清楚，几乎无需解读。", "中等：需要一些解读或综合多个来源。", "困难：证据矛盾或间接，措辞微妙。", "非常困难：影响重大，来源矛盾且措辞微妙。"]
      edge:
        instructions: "说法C2与说法C1是什么关系？"
        supports: "C2为C1提供证据。"
        contradicts: "C2与C1相矛盾。"
        depends_on: "只有C2为真时C1才为真。"
        elaborates: "C2为C1补充细节。"
        unrelated: "没有实质关系。"
      domain_tier:
        instructions: "这个网站属于哪类来源？"
        authoritative: "官方或一手来源：政府、国际机构、监管机构、法院、大学、学术期刊、该组织本身。"
        reputable_news: "具有编辑标准的知名新闻媒体。"
        local_media: "地区或地方媒体。"
        social: "社交网络、论坛、视频或用户生成内容平台。"
        low_reliability: "未知、匿名、带有倾向性或不可靠。"
      oracle:
        best: "哪一条事实核查与用户的说法是同一说法？"
        best_none: "没有一条涉及这一说法。"
        match: "该事实核查与用户的说法有多接近？"
        match_levels: ["不同说法，只有关键词相同。", "相关话题。", "部分相同的说法。", "相同说法，但措辞或细节不同。", "基本上是同一说法。"]
        status: "该事实核查得出了什么结论？"
        status_confirmed: "属实或已证实。"
        status_refuted: "不实、虚假或已辟谣。"
        status_mixed: "部分属实、误导或缺少背景。"
        rating: "该事实核查认为这一说法有多真实？"
        rating_levels: ["不实。", "大部分不实。", "一半属实。", "大部分属实。", "属实。"]
      plan:
        evidence_need: "什么样的证据可以判定这一说法？"
        need_official_stats: "官方统计或登记资料。"
        need_empirical_study: "科学研究或数据分析。"
        need_guideline: "官方指南或规定。"
        need_news_report: "关于该事件的新闻报道。"
        need_expert_opinion: "专家评估。"
        need_definition: "定义或参考资料。"
        need_anecdotal: "个人陈述。"
        need_unknown: "不清楚。"
        search_method: "这些证据最可能在哪里找到？"
        method_general_search: "普通网络搜索。"
        method_news: "新闻报道。"
        method_academic: "学术文献。"
        needs_primary: "核查这一说法是否需要一手来源（原始文件、数据集或声明）？"
        structure_type: "这是哪一类陈述？"
        type_empirical_numeric: "一个数字或测量值。"
        type_event: "一个已发生的事件。"
        type_causal: "一种因果关系。"
        type_attribution: "转述某人的话。"
        type_definition: "一个定义。"
        type_policy_plan: "一项政策、计划或决定。"
        type_forecast: "一个预测。"
        type_meta_scientific: "关于科学发现的陈述。"
        type_other: "其他。"
      evidence_audit:
        stance: "该证据是支持该说法、反驳该说法、无法判断，还是与之无关？"
        stance_support: "支持该说法及其细节。"
        stance_refute: "与该说法或其某个细节相矛盾。"
        stance_unclear: "相关，但不能下结论。"
        stance_unrelated: "涉及其他内容。"
        directness: "该证据在多大程度上直接涉及该说法？"
        directness_direct: "正是该说法所主张的内容。"
        directness_indirect: "仅通过相关事实涉及。"
        directness_tangential: "只是触及该话题。"
        specificity: "该证据对说法细节的对应有多具体？"
        specificity_high: "给出相同的具体事实、数字或名称。"
        specificity_medium: "给出部分具体内容。"
        specificity_low: "内容笼统。"
        quote_integrity: "引文是否被忠实使用？"
        quote_integrity_ok: "准确且符合语境。"
        quote_integrity_partial: "部分引用或经过删节。"
        quote_integrity_out_of_context: "断章取义。"
        quote_integrity_not_applicable: "没有引文。"
        novelty_vs_copy: "这是原创报道还是对其他来源的复制？"
        novelty_vs_copy_original: "原创报道。"
        novelty_vs_copy_syndicated: "其他媒体报道的复制或改写。"
        novelty_vs_copy_unknown: "无法判断。"
      stance:
        instructions: "该来源是支持该说法、反驳该说法、仅提供背景，还是与之无关？"
        support: "它陈述或报道了该说法所主张的内容，包括其具体细节。"
        refute: "它陈述或报道的内容与该说法或其某个细节相矛盾。"
        context: "它涉及同一主题，但既不证实也不反驳该说法。"
        irrelevant: "它涉及其他内容。"
      extract:
        instructions: "该搜索结果是否可能包含证实或反驳该声明的证据，因而值得阅读整个页面？"
      search_stop:
