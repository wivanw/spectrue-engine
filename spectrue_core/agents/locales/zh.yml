        role_support: "支持主要声明的声明。"
        role_context: "为文本提供背景的上下文信息。"
        role_counterclaim: "文本所反驳的声明。"
        role_attribution: "转述某人所说的话。"
        harm: "如果这条声明是假的，相信它可能造成多大危害？"
