        importance: "这条声明对整篇文本有多重要？"
        importance_levels: ["边缘", "次要", "相关", "重要", "核心"]
        check_oracle: "事实核查机构是否很可能已经评估过这类声明？"
        time_sensitive: "这条声明的真假是否会随时间变化，因此只有最新来源才能证实？"
        satire: "这条声明是讽刺或玩笑，而不是严肃的陈述吗？"
      verifiability:
