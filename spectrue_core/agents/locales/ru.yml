ru:
  prompts:
    claim_judge: |
      Ты — судья по проверке фактов. Оцени утверждение на основе доказательств, указанных в секции DATA ниже, и вынеси вердикт.

      В секции DATA ты получишь:
      - утверждение (id, текст, язык)
      - оригинальный контекст
      - элементы доказательств (фрагменты/цитаты/выдержки)
      - краткое содержание доказательств (предварительный анализ)
      - статистику доказательств
      - список URL источников

      ## МЕТОДОЛОГИЯ ОЦЕНКИ

      Следуй этому процессу оценки:
      1. **Оценка доказательств**: Что на самом деле говорят источники? Называй конкретные источники/домены.
      2. **Проверка на манипуляции**: Ищи выборочное представление фактов (cherry-picking), отсутствие контекста, сенсационность, эмоционально окрашенную лексику.
      3. **Выявление пробелов**: Каких доказательств не хватает? Четко укажи на ограничения.
      4. **Статистика и структура доказательств**:
         Используй evidence_stats ТОЛЬКО для того, чтобы:
         - отличить избыточность (exact_content_groups) от независимости (precision_publishers_*)
         - упомянуть пробелы в охвате (direct_anchors / covered_slots / unique_domains)
         НЕ расценивай эти счетчики как доказательства сами по себе.
      5. **Вердикт**: Базируюйся ТОЛЬКО на доказательствах. Если доказательств недостаточно, так и скажи — используй -1 для оценок.

      ## РУКОВОДСТВО ПО ОЦЕНКЕ RGBA

      **R (Опасность: 0.0-1.0 или -1)**: Потенциальный вред
        - 0.0-0.2 = Безвредно
        - 0.5-0.8 = Медицинская/финансовая дезинформация
        - 0.8-1.0 = Опасные призывы
        - **-1** = Невозможно оценить

      **G (Правдивость: 0.0-1.0 или -1)**: Фактическая точность — ДОЛЖНА соответствовать вердикту!
        - 0.0-0.2 = **Сильное опровержение**
        - 0.4-0.6 = **Недостаточно доказательств** / противоречивые данные
        - 0.8-1.0 = **Сильное подтверждение**
        - **-1** = Невозможно определить (NEI)

      **B (Честность: 0.0-1.0 или -1)**: Качество подачи/добросовестность
        - 0.0-0.3 = Введение в заблуждение/Пропаганда
        - 0.5-0.7 = Выборочное представление (Cherry-picking)
        - 0.9-1.0 = Нейтрально/Сбалансировано
        - **-1** = Невозможно оценить

      **A (Объяснимость: 0.0-1.0 или -1)**: Сила доказательств
        - 0.0-0.2 = Доказательств нет
        - 0.6-0.8 = Прямые цитаты
        - 0.8-1.0 = Несколько независимых цитат
        - **-1** = Нет релевантных доказательств

      **Вердикт**: На основе оценки G:
        - **"Supported"** → 0.7-1.0
        - **"Refuted"** → 0.0-0.3
        - **"Mixed"** → 0.3-0.7
        - **"NEI"** → -1 (Недостаточно информации)
        - **"Unverifiable"** → -1

      **Уверенность**: 0.0-1.0 (ниже, если источники слабые/противоречивые)

      **Пояснение**: СТРУКТУРИРОВАННЫЙ формат на языке утверждения:
        - Строка 1: "Доказательства:" - цитируй источники
        - Строка 2: "Пробелы:" - чего не хватает
        - Строка 3: "Вердикт:" - вывод
        - Строка 4: "Стиль:" - ТОЛЬКО если B < 0.7

      **sources_used**: URL-адреса из списка в секции DATA ниже (используй только эти URL).

      ## ФОРМАТ ВЫВОДА (JSON)
      {{
        "claim_id": "<из данных>",
        "rgba": {{ "R": 0.0, "G": 0.0, "B": 0.0, "A": 0.0 }},
        "confidence": 0.5,
        "verdict": "Supported|Refuted|NEI|Mixed",
        "explanation": "...",
        "sources_used": [],
        "missing_evidence": []
      }}

    decisions:
      judge_routing:
        difficulty: "Насколько сложно правильно оценить это утверждение по этим доказательствам?"
        levels: ["Тривиально: доказательства прямо это утверждают.", "Легко: чёткие доказательства, мало толкования.", "Умеренно: нужно толкование или объединение нескольких источников.", "Сложно: противоречивые или косвенные доказательства, тонкая формулировка.", "Очень сложно: высокие ставки, противоречивые источники и тонкая формулировка."]
      edge:
        instructions: "Как утверждение C2 связано с утверждением C1?"
        supports: "C2 является доказательством в пользу C1."
        contradicts: "C2 противоречит C1."
        depends_on: "C1 истинно, только если истинно C2."
        elaborates: "C2 добавляет детали к C1."
        unrelated: "Существенной связи нет."
      domain_tier:
        instructions: "Что это за источник?"
        authoritative: "Официальный или первоисточник: госорган, международная организация, регулятор, суд, университет, научный журнал, сама организация."
        reputable_news: "Известное новостное издание с редакционными стандартами."
        local_media: "Региональное или местное СМИ."
        social: "Соцсеть, форум, видео или платформа пользовательского контента."
        low_reliability: "Неизвестный, анонимный, ангажированный или ненадёжный."
      oracle:
        best: "Какая проверка фактов касается того же утверждения, что и утверждение пользователя?"
        best_none: "Ни одна из них не касается этого утверждения."
        match: "Насколько эта проверка соответствует утверждению пользователя?"
        match_levels: ["Другое утверждение, общие лишь слова.", "Связанная тема.", "Частично то же утверждение.", "То же утверждение, другая формулировка или детали.", "По сути то же утверждение."]
        status: "Какой вывод сделала эта проверка?"
        status_confirmed: "Правда или подтверждено."
        status_refuted: "Ложь, фейк или опровергнуто."
        status_mixed: "Отчасти правда, манипуляция или не хватает контекста."
        rating: "Насколько правдивым эта проверка оценивает утверждение?"
        rating_levels: ["Ложь.", "В основном ложь.", "Наполовину правда.", "В основном правда.", "Правда."]
      plan:
        evidence_need: "Какие доказательства могли бы решить это утверждение?"
        need_official_stats: "Официальная статистика или реестры."
        need_empirical_study: "Научные исследования или анализ данных."
        need_guideline: "Официальные руководства или правила."
        need_news_report: "Новостные сообщения о событии."
        need_expert_opinion: "Оценка экспертов."
        need_definition: "Определение или справочное издание."
        need_anecdotal: "Личные свидетельства."
        need_unknown: "Неясно."
        search_method: "Где эти доказательства вероятнее всего найти?"
        method_general_search: "Общий поиск в интернете."
        method_news: "Новости."
        method_academic: "Научная литература."
        needs_primary: "Нужен ли для проверки первоисточник (оригинальный документ, набор данных или заявление)?"
        structure_type: "Что это за утверждение?"
        type_empirical_numeric: "Число или измерение."
        type_event: "Произошедшее событие."
        type_causal: "Причинно-следственная связь."
        type_attribution: "Пересказ чьих-то слов."
        type_definition: "Определение."
        type_policy_plan: "Политика, план или решение."
        type_forecast: "Прогноз."
        type_meta_scientific: "Утверждение о научных результатах."
