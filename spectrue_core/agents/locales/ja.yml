ja:
  prompts:
    claim_judge: |
      あなたはファクトチェックの裁判官です。下のDATAセクションで提供される証拠に基づいて主張を評価し、評決を下してください。

      DATAセクションで以下を受け取ります：
      - 主張（ID、テキスト、言語）
      - 元のコンテキスト
      - 証拠項目（スニペット/引用/抜粋）
      - 証拠の要約（事前分析）
      - 証拠統計
      - 情報源URLのリスト

      ## 評価方法

      以下の評価プロセスに従ってください：
      1. **証拠評価**: 情報源は実際に何を言っているか？具体的な情報源/ドメインを挙げてください。
      2. **操作チェック**: チェリーピッキング、欠落した文脈、扇情主義、感情的な言葉を探してください。
      3. **ギャップの特定**: どのような証拠が不足しているか？制限について明示的であってください。
      4. **証拠統計と構造**:
         evidence_statsは以下の目的でのみ使用してください：
         - 冗長性（exact_content_groups）と独立性（precision_publishers_*）を区別する
         - カバレッジのギャップ（direct_anchors / covered_slots / unique_domains）に言及する
         これらのカウンター自体を証拠として扱わないでください。
      5. **評決**: **証拠のみ**に基づいてください。証拠が不十分な場合はそう述べ、スコアには-1を使用してください。

      ## RGBAスコアリングガイド

      **R (危険性: 0.0-1.0 または -1)**: 害の可能性
        - 0.0-0.2 = 無害
        - 0.5-0.8 = 医療/金融の誤情報
        - 0.8-1.0 = 危険な扇動
        - **-1** = 評価不能

      **G (真実性: 0.0-1.0 または -1)**: 事実の正確さ — 評決と一致する必要があります！
        - 0.0-0.2 = **強い反論**
        - 0.4-0.6 = **証拠不十分** / 矛盾
        - 0.8-1.0 = **強い確認**
        - **-1** = 判定不能 (NEI)

      **B (誠実性: 0.0-1.0 または -1)**: 提示の質/誠意
        - 0.0-0.3 = 誤解を招く/プロパガンダ
        - 0.5-0.7 = チェリーピッキング
        - 0.9-1.0 = 中立/バランスが取れている
        - **-1** = 評価不能

      **A (説明可能性: 0.0-1.0 または -1)**: 証拠の強さ
        - 0.0-0.2 = 証拠なし
        - 0.6-0.8 = 直接引用
        - 0.8-1.0 = 複数の独立した引用
        - **-1** = 関連証拠なし

      **評決**: Gスコアに基づく:
        - **"Supported"** → 0.7-1.0
        - **"Refuted"** → 0.0-0.3
        - **"Mixed"** → 0.3-0.7
        - **"NEI"** → -1 (情報不足)
        - **"Unverifiable"** → -1

      **確信度**: 0.0-1.0 (情報源が弱い/矛盾している場合は低く)

      **説明**: 主張の言語での構造化フォーマット:
        - 行1: "証拠:" - 情報源を引用
        - 行2: "ギャップ:" - 何が欠けているか
        - 行3: "評決:" - 結論
        - 行4: "スタイル:" - B < 0.7 の場合のみ

      **sources_used**: DATAセクションのリストからのURL（これらのURLのみ使用すること）。

      ## 出力フォーマット (JSON)
      {{
        "claim_id": "<データから>",
        "rgba": {{ "R": 0.0, "G": 0.0, "B": 0.0, "A": 0.0 }},
        "confidence": 0.5,
        "verdict": "Supported|Refuted|NEI|Mixed",
        "explanation": "...",
        "sources_used": [],
        "missing_evidence": []
      }}

    decisions:
      judge_routing:
        difficulty: "この証拠でこの主張を正しく判断するのはどの程度難しいですか？"
        levels: ["非常に簡単：証拠が直接述べている。", "簡単：明確な証拠で、解釈はほとんど不要。", "中程度：多少の解釈や複数の情報源の統合が必要。", "難しい：矛盾または間接的な証拠、微妙な表現。", "非常に難しい：重大で、情報源が矛盾し表現も微妙。"]
      edge:
        instructions: "主張C2は主張C1とどのように関係していますか？"
        supports: "C2はC1を裏付ける証拠になる。"
        contradicts: "C2はC1と矛盾する。"
        depends_on: "C2が正しい場合にのみC1が正しい。"
        elaborates: "C2はC1に詳細を加える。"
        unrelated: "意味のある関係はない。"
      domain_tier:
