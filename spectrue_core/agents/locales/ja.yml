        need_guideline: "公式のガイドラインや規則。"
        need_news_report: "出来事に関するニュース報道。"
        need_expert_opinion: "専門家の評価。"
        need_definition: "定義や参考文献。"
        need_anecdotal: "個人的な証言。"
        need_unknown: "不明。"
        search_method: "その証拠はどこで見つかる可能性が最も高いですか？"
        method_general_search: "一般的なウェブ検索。"
        method_news: "ニュース。"
        method_academic: "学術文献。"
        needs_primary: "この主張の確認には一次資料（原文書、データセット、声明）が必要ですか？"
        structure_type: "これはどのような種類の記述ですか？"
        type_empirical_numeric: "数値や測定値。"
        type_event: "起きた出来事。"
