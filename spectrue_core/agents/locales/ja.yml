        authoritative: "公式または一次情報源：政府、国際機関、規制当局、裁判所、大学、学術誌、当該組織自身。"
        reputable_news: "編集基準を持つ定評ある報道機関。"
        local_media: "地方・地域メディア。"
        social: "SNS、掲示板、動画、ユーザー投稿型プラットフォーム。"
        low_reliability: "不明、匿名、偏向的、または信頼性が低い。"
