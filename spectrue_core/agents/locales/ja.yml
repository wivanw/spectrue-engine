        status: "そのファクトチェックはどのような結論を出しましたか？"
        status_confirmed: "正しい、または確認済み。"
        status_refuted: "誤り、偽情報、または反証済み。"
        status_mixed: "部分的に正しい、誤解を招く、または文脈不足。"
        rating: "そのファクトチェックは主張をどの程度正しいと評価していますか？"
        rating_levels: ["誤り。", "ほぼ誤り。", "半分正しい。", "ほぼ正しい。", "正しい。"]
      plan:
        evidence_need: "この主張を決着させるのはどのような証拠ですか？"
        need_official_stats: "公式統計や登録簿。"
