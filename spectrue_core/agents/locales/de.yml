de:
  prompts:
    claim_judge: |
      Du bist ein unabhängiger Faktenprüfer und Richter. Bewerte die Behauptung anhand der Beweise in der DATA-Sektion unten und fälle ein Urteil.

      Du erhältst in der DATA-Sektion:
      - Behauptung (ID, Text, Sprache)
      - ursprünglicher Kontext
      - Beweiselemente (Snippets/Zitate/Auszüge)
      - Zusammenfassung der Beweise (Voranalyse)
      - Beweisstatistik
      - Liste der Quellen-URLs

      ## METHODIK DER BEURTEILUNG

      Folge diesem Bewertungsprozess:
      1. **Beweisbewertung**: Was sagen die Quellen tatsächlich? Nenne spezifische Quellen/Domains.
      2. **Manipulationsprüfung**: Achte auf Rosinenpickerei (Cherry-Picking), fehlenden Kontext, Sensationalismus, emotionale Sprache.
      3. **Lückenidentifikation**: Welche Beweise fehlen? Sei explizit bezüglich der Einschränkungen.
      4. **Beweisstatistik & Struktur**:
         Verwende evidence_stats NUR um:
         - Redundanz (exact_content_groups) von Unabhängigkeit (precision_publishers_*) zu unterscheiden
         - Abdeckungslücken (direct_anchors / covered_slots / unique_domains) zu erwähnen
         Behandle diese Zähler NICHT als Beweise an sich.
      5. **Urteil**: Basieren NUR auf Beweisen. Wenn Beweise unzureichend sind, sage es – verwende -1 für Scores.

      ## RGBA-BEWERTUNGSLEITFADEN

      **R (Gefahr: 0.0-1.0 oder -1)**: Potenzielle Schädlichkeit
        - 0.0-0.2 = Harmlos
        - 0.5-0.8 = Medizinische/finanzielle Fehlinformation
        - 0.8-1.0 = Gefährliche Aufhetzung
        - **-1** = Nicht bewertbar

      **G (Wahrheitsgehalt: 0.0-1.0 oder -1)**: Faktische Genauigkeit – MUSS zum Urteil passen!
        - 0.0-0.2 = **Starke Widerlegung**
        - 0.4-0.6 = **Unzureichende Beweise** / widersprüchlich
        - 0.8-1.0 = **Starke Bestätigung**
        - **-1** = Nicht bestimmbar (NEI)

      **B (Ehrlichkeit: 0.0-1.0 oder -1)**: Qualität der Darstellung/Gutgläubigkeit
        - 0.0-0.3 = Irreführend/Propaganda
        - 0.5-0.7 = Rosinenpickerei (Cherry-Picking)
        - 0.9-1.0 = Neutral/Ausgewogen
        - **-1** = Nicht bewertbar

      **A (Erklärbarkeit: 0.0-1.0 oder -1)**: Stärke der Beweise
        - 0.0-0.2 = Keine Beweise
        - 0.6-0.8 = Direkte Zitate
        - 0.8-1.0 = Mehrere unabhängige Zitate
        - **-1** = Keine relevanten Beweise

      **Urteil**: Basierend auf dem G-Score:
        - **"Supported"** → 0.7-1.0
        - **"Refuted"** → 0.0-0.3
        - **"Mixed"** → 0.3-0.7
        - **"NEI"** → -1 (Nicht genug Informationen)
        - **"Unverifiable"** → -1

      **Konfidenz**: 0.0-1.0 (niedriger, wenn Quellen schwach/widersprüchlich sind)

      **Erklärung**: STRUKTURIERTES Format in der Behauptungssprache:
        - Zeile 1: "Beweise:" - zitiere Quellen
        - Zeile 2: "Lücken:" - was fehlt
        - Zeile 3: "Urteil:" - Schlussfolgerung
        - Zeile 4: "Stil:" - NUR wenn B < 0.7

      **sources_used**: URLs aus der Liste in der DATA-Sektion unten (nur diese URLs verwenden).

      ## AUSGABEFORMAT (JSON)
      {{
        "claim_id": "<aus Daten>",
        "rgba": {{ "R": 0.0, "G": 0.0, "B": 0.0, "A": 0.0 }},
        "confidence": 0.5,
        "verdict": "Supported|Refuted|NEI|Mixed",
        "explanation": "...",
        "sources_used": [],
        "missing_evidence": []
      }}

    decisions:
      judge_routing:
        difficulty: "Wie schwer ist es, diese Aussage anhand dieser Belege richtig zu beurteilen?"
        levels: ["Trivial: die Belege sagen es direkt.", "Leicht: klare Belege, wenig Auslegung.", "Mittel: etwas Auslegung oder mehrere Quellen zu verbinden.", "Schwer: widersprüchliche oder indirekte Belege, feine Formulierung.", "Sehr schwer: viel steht auf dem Spiel, widersprüchliche Quellen und feine Formulierung."]
      edge:
        instructions: "Wie hängt Aussage C2 mit Aussage C1 zusammen?"
        supports: "C2 liefert Belege für C1."
        contradicts: "C2 widerspricht C1."
        depends_on: "C1 ist nur wahr, wenn C2 wahr ist."
        elaborates: "C2 ergänzt C1 um Details."
        unrelated: "Kein relevanter Zusammenhang."
      domain_tier:
        instructions: "Was für eine Quelle ist diese Website?"
        authoritative: "Eine offizielle oder Primärquelle: Behörde, internationale Organisation, Regulierer, Gericht, Universität, Fachzeitschrift, die Organisation selbst."
        reputable_news: "Ein etabliertes Nachrichtenmedium mit redaktionellen Standards."
        local_media: "Regionale oder lokale Medien."
        social: "Ein soziales Netzwerk, Forum, Video- oder Nutzerinhalt-Plattform."
        low_reliability: "Unbekannt, anonym, parteiisch oder unzuverlässig."
      oracle:
        best: "Welcher Faktencheck betrifft dieselbe Behauptung wie die des Nutzers?"
        best_none: "Keiner betrifft diese Behauptung."
        match: "Wie genau entspricht dieser Faktencheck der Behauptung des Nutzers?"
        match_levels: ["Andere Behauptung, nur gemeinsame Wörter.", "Verwandtes Thema.", "Teilweise dieselbe Behauptung.", "Dieselbe Behauptung, andere Formulierung oder Details.", "Im Wesentlichen dieselbe Behauptung."]
        status: "Zu welchem Ergebnis kam dieser Faktencheck?"
        status_confirmed: "Wahr oder bestätigt."
        status_refuted: "Falsch, Fake oder widerlegt."
        status_mixed: "Teilweise wahr, irreführend oder ohne Kontext."
        rating: "Wie wahr bewertet dieser Faktencheck die Behauptung?"
        rating_levels: ["Falsch.", "Größtenteils falsch.", "Halb wahr.", "Größtenteils wahr.", "Wahr."]
      plan:
        evidence_need: "Welche Belege könnten diese Behauptung entscheiden?"
        need_official_stats: "Amtliche Statistiken oder Register."
        need_empirical_study: "Wissenschaftliche Studien oder Datenanalysen."
        need_guideline: "Offizielle Leitlinien oder Regeln."
        need_news_report: "Nachrichtenberichte über das Ereignis."
        need_expert_opinion: "Einschätzung von Fachleuten."
        need_definition: "Eine Definition oder ein Nachschlagewerk."
        need_anecdotal: "Persönliche Berichte."
        need_unknown: "Unklar."
        search_method: "Wo sind diese Belege am ehesten zu finden?"
        method_general_search: "Allgemeine Websuche."
        method_news: "Nachrichten."
        method_academic: "Fachliteratur."
        needs_primary: "Braucht die Prüfung eine Primärquelle (Originaldokument, Datensatz oder Erklärung)?"
        structure_type: "Was für eine Aussage ist das?"
        type_empirical_numeric: "Eine Zahl oder Messung."
        type_event: "Ein Ereignis, das stattgefunden hat."
        type_causal: "Ein Ursache-Wirkungs-Zusammenhang."
        type_attribution: "Die Wiedergabe einer Äußerung."
        type_definition: "Eine Definition."
        type_policy_plan: "Eine Politik, ein Plan oder eine Entscheidung."
        type_forecast: "Eine Vorhersage."
        type_meta_scientific: "Eine Aussage über wissenschaftliche Ergebnisse."
        type_other: "Etwas anderes."
      evidence_audit:
        stance: "Stützt dieser Beleg die Behauptung, widerlegt er sie, lässt er sie offen oder ist er ohne Bezug?"
        stance_support: "Stützt die Behauptung und ihre Details."
        stance_refute: "Widerspricht der Behauptung oder einem ihrer Details."
        stance_unclear: "Bezogen, entscheidet die Frage aber nicht."
        stance_unrelated: "Handelt von etwas anderem."
        directness: "Wie direkt bezieht sich der Beleg auf die Behauptung?"
        directness_direct: "Er behandelt genau das Behauptete."
        directness_indirect: "Nur über verwandte Fakten."
        directness_tangential: "Er streift das Thema nur."
        specificity: "Wie konkret entspricht der Beleg den Details der Behauptung?"
        specificity_high: "Er nennt dieselben konkreten Fakten, Zahlen oder Namen."
        specificity_medium: "Er nennt einen Teil der Details."
        specificity_low: "Er ist allgemein."
        quote_integrity: "Wird das Zitat getreu verwendet?"
        quote_integrity_ok: "Genau und im Kontext."
        quote_integrity_partial: "Teilweise oder gekürzt."
        quote_integrity_out_of_context: "Aus dem Zusammenhang gerissen."
        quote_integrity_not_applicable: "Es gibt kein Zitat."
        novelty_vs_copy: "Ist das eigene Berichterstattung oder eine Kopie einer anderen Quelle?"
        novelty_vs_copy_original: "Eigene Berichterstattung."
        novelty_vs_copy_syndicated: "Kopie oder Nacherzählung eines anderen Mediums."
        novelty_vs_copy_unknown: "Nicht erkennbar."
      stance:
        instructions: "Stützt diese Quelle die Behauptung, widerspricht sie ihr, liefert sie nur Kontext oder hat sie nichts damit zu tun?"
        support: "Sie sagt oder berichtet, was die Behauptung aussagt, einschließlich ihrer konkreten Details."
        refute: "Sie sagt oder berichtet etwas, das der Behauptung oder einem ihrer Details widerspricht."
        context: "Sie behandelt dasselbe Thema, bestätigt die Behauptung aber weder noch widerlegt sie sie."
        irrelevant: "Sie handelt von etwas anderem."
      extract:
        instructions: "Enthält dieses Suchergebnis wahrscheinlich Belege, die die Behauptung bestätigen oder widerlegen, sodass sich das Lesen der ganzen Seite lohnt?"
      search_stop:
        instructions: "Enthalten die bisher gefundenen Quellen bereits genug Belege, um die Behauptung zu beurteilen, sodass keine weitere Suche nötig ist?"
      inline_source:
        relevant: "Ist diese verlinkte Quelle für mindestens eine der Behauptungen relevant?"
        primary: "Ist dies eine PRIMÄRQUELLE, also der ursprüngliche Herausgeber der Information (offizielle Erklärung, Originaldokument, eigene Plattform des Autors), und nicht Berichterstattung darüber?"
      metadata:
        verification_target: "Was lässt sich an dieser Behauptung überprüfen?"
        vt_reality: "Ob sie in der Wirklichkeit zutrifft."
        vt_attribution: "Ob eine genannte Person oder Organisation das wirklich gesagt oder geschrieben hat."
        vt_existence: "Ob ein genanntes Dokument, Ereignis oder Ding existiert."
        vt_none: "Nichts: Es ist eine Meinung, eine Prognose, ein Witz oder eine Anweisung."
        claim_role: "Welche Rolle spielt diese Behauptung im Text?"
        role_core: "Eine Hauptaussage des Textes."
        role_support: "Eine Aussage, die eine Hauptaussage stützt."
        role_context: "Kontext oder Hintergrund, der den Text einrahmt."
        role_counterclaim: "Eine Aussage, gegen die der Text argumentiert."
        role_attribution: "Eine Wiedergabe dessen, was jemand gesagt hat."
        harm: "Wie schädlich wäre es, dieser Behauptung zu glauben, wenn sie falsch ist?"
        harm_levels: ["Kein Schaden oder belanglos", "Gering", "Mäßig", "Ernst (Geld, Sicherheit, Ruf)", "Schwer (Gesundheit, Leben, öffentliche Sicherheit)"]
        importance: "Wie wichtig ist diese Behauptung für den Text insgesamt?"
        importance_levels: ["Nebensächlich", "Gering", "Relevant", "Wichtig", "Zentral"]
        check_oracle: "Haben Faktencheck-Organisationen eine solche Behauptung wahrscheinlich schon bewertet?"
        time_sensitive: "Kann sich der Wahrheitsgehalt dieser Behauptung mit der Zeit ändern, sodass nur aktuelle Quellen sie bestätigen können?"
        satire: "Ist diese Behauptung Satire oder ein Witz statt einer ernsthaften Aussage?"
      verifiability:
        instructions: "Ist dies eine konkrete Tatsachenbehauptung, die anhand öffentlicher Quellen überprüft werden kann (keine Meinung, Prognose, kein Witz und keine Anleitung)?"

  ui:
    popup:
      not_available: "Nicht verfügbar"
