        need_official_stats: "Офіційна статистика чи реєстри."
        need_empirical_study: "Наукові дослідження чи аналіз даних."
        need_guideline: "Офіційні настанови чи правила."
        need_news_report: "Новинні повідомлення про подію."
        need_expert_opinion: "Оцінка експертів."
